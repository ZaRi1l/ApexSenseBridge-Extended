name: Build and publish full Extended Nov 6 integration

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-integrated-nov6.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-extended-nov6-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout distribution metadata
        uses: actions/checkout@v4
        with:
          path: distribution

      - name: Checkout full Extended integrated November 6 source
        uses: actions/checkout@v4
        with:
          repository: ZaRi1l/ApexSenseBridge
          ref: 7589dbb38e4a13b46d1d4f8e001fe878395206ff
          submodules: recursive
          persist-credentials: false
          path: source

      - name: Verify full Extended source and runtime wiring
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $haptic = Get-Content -LiteralPath 'source\src\dualsense\Apex6HapticBridge.cpp' -Raw
          $xaml = Get-Content -LiteralPath 'source\ApexSenseBridgeTray\GameListWindow.xaml' -Raw
          $scaler = Get-Content -LiteralPath 'source\src\dualsense\Apex6PcmNormalization.h' -Raw
          $options = Get-Content -LiteralPath 'source\src\cli\BridgeOptions.cpp' -Raw
          foreach ($check in @(
            @($haptic, 'pcmExtension_.scale'),
            @($haptic, 'pcmExtension_.publish'),
            @($xaml, 'TxtApex6PcmMeasureAction'),
            @($xaml, 'BtnSettingsPcmMeasure'),
            @($scaler, 'scaleApex6PcmLinear'),
            @($options, '--apex6-linear-gain')
          )) {
            if (-not $check[0].Contains($check[1])) { throw "Missing integrated feature: $($check[1])" }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Go for VIIPER sidecar
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Build patched VIIPER backend and fallback
        shell: powershell
        working-directory: source
        run: |
          .\scripts\build-viiper-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build-libviiper-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native engine
        shell: powershell
        working-directory: source
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build tray and run WPF tests
        shell: powershell
        working-directory: source
        run: |
          .\scripts\build-tray-app.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native regression tests
        shell: powershell
        working-directory: source
        run: |
          ctest --test-dir .\build-win -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Extended UI and PCM regression contracts
        shell: powershell
        working-directory: source
        run: |
          python tests/test_pcm_extension_isolation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_pcm_wpf_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_pcm_settings_monitor_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package full Extended ZIP (not installer)
        shell: powershell
        working-directory: source
        run: |
          .\scripts\build-portable.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add GPL and corresponding source details to public preview ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceZip = Join-Path $PWD 'source\dist\ApexSenseBridge-Portable.zip'
          if (-not (Test-Path -LiteralPath $sourceZip -PathType Leaf)) { throw 'Portable ZIP missing' }
          New-Item -ItemType Directory -Path 'release-output', 'release-staging' -Force | Out-Null
          Expand-Archive -LiteralPath $sourceZip -DestinationPath 'release-staging' -Force
          $upstream = Join-Path $PWD 'release-staging\ApexSenseBridge-Portable'
          if (-not (Test-Path -LiteralPath $upstream -PathType Container)) { throw 'Unexpected portable ZIP layout' }
          Rename-Item -LiteralPath $upstream -NewName 'ApexSenseBridge-Extended'
          $payload = Join-Path $PWD 'release-staging\ApexSenseBridge-Extended'
          foreach ($f in @(
            'ApexSenseBridge.exe','ApexSenseBridgeControl.exe',
            'ApexSenseBridgeTray.exe','libVIIPER.dll','viiper.exe',
            'Start-ApexSenseBridge.cmd','Install-Drivers.cmd',
            'Licenses\VIIPER-LICENSE.txt','Licenses\THIRD_PARTY_NOTICES.md',
            'Drivers\USBip-0.9.8.0-x64.exe','Drivers\HidHide_1.5.230_x64.exe'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $payload $f) -PathType Leaf)) {
              throw "Missing required file in portable ZIP: $f"
            }
          }
          Copy-Item 'distribution\COPYING' (Join-Path $payload 'Licenses\GPL-3.0.txt') -Force
          $sourceInfo = @(
            '# Corresponding Source',
            'Exact source revision: 7589dbb38e4a13b46d1d4f8e001fe878395206ff',
            'https://github.com/ZaRi1l/ApexSenseBridge/tree/7589dbb38e4a13b46d1d4f8e001fe878395206ff',
            'Original: https://github.com/ReynArts/ApexSenseBridge',
            'This preview includes Extended per-game UI and PCM live measurement.',
            'Build via scripts in pinned repository. See GPL and third-party notices.'
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $payload 'SOURCE-CODE.md'), $sourceInfo,
            (New-Object System.Text.UTF8Encoding($false)))
          Copy-Item 'source\docs\APEX6_LINEAR_PCM_CONTRIBUTION.md' (Join-Path $payload 'APEX6_LINEAR_PCM_CONTRIBUTION.md') -Force
          Copy-Item 'distribution\THIRD_PARTY_NOTICES.md' (Join-Path $payload 'THIRD_PARTY_NOTICES-DISTRIBUTION.md') -Force
          $note = @(
            'Unofficial full Extended November 6 integration beta - Windows 10/11 x64',
            'Upstream: https://github.com/ReynArts/ApexSenseBridge',
            'Source: https://github.com/ZaRi1l/ApexSenseBridge/tree/7589dbb38e4a13b46d1d4f8e001fe878395206ff',
            'License: GPL-3.0-or-later (see Licenses/GPL-3.0.txt and notices)',
            'Unsigned experimental build; hardware endurance is NOT certified.',
            'Extract once; check Drivers/ prerequisites, then run Start-ApexSenseBridge.cmd.',
            'Do not run this build alongside the original ApexSenseBridge.',
            'Already installed USBip/HidHide drivers should not be reinstalled.',
            'Stop using if the controller overheats, makes abnormal noise, or vibrates harshly.'
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $payload 'READ-ME-FIRST.txt'),
            $note, (New-Object System.Text.UTF8Encoding($false)))
          if (@(Get-ChildItem -LiteralPath $payload -Filter '*.zip' -File).Count -gt 0) {
            throw 'Nested ZIP not allowed'
          }
          $zip = Join-Path $PWD 'release-output\ApexSenseBridge-Extended-Preview-20261108.zip'
          Compress-Archive -LiteralPath $payload -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $paths = @($z.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($f in @('ApexSenseBridgeTray.exe','Start-ApexSenseBridge.cmd','Licenses/GPL-3.0.txt','SOURCE-CODE.md')) {
              if (-not ($paths -contains "ApexSenseBridge-Extended/$f")) {
                throw "Public ZIP missing $f"
              }
            }
          } finally { $z.Dispose() }
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'release-output\SHA256SUMS.txt'),
            "$digest  ApexSenseBridge-Extended-Preview-20261108.zip`n",
            (New-Object System.Text.UTF8Encoding($false)))
          $notes = @(
            '# ApexSenseBridge Extended Preview - Nov 6 fully integrated',
            '',
            'This is the complete Extended UI, not the core-only contribution.',
            'Restored live native PCM input/output measurements, per-game gain',
            'settings, clipping indicators and the active-session IPC controls.',
            'Based on the November 6 upstream dev code and Extended UI merge.',
            'The November 6 integer linear PCM scaler is used by the UI.',
            '',
            'Exact source: https://github.com/ZaRi1l/ApexSenseBridge/tree/7589dbb38e4a13b46d1d4f8e001fe878395206ff',
            '',
            'Windows 10/11 x64 unsigned experimental portable ZIP.',
            'Start ApexSenseBridgeTray.exe; do not run another ASB concurrently.',
            'Existing USBip and HidHide drivers need not be reinstalled.',
            'Increase gain gradually, beginning at 100%.',
            'Software regression tests do not certify physical hardware safety.'
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD 'release-output\RELEASE_NOTES.md'), $notes,
            (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Verified full Extended preview ZIP SHA-256: $digest"

      - name: Publish full Extended preview as a separate release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-2026.11.08-integrated-beta.1
          name: ApexSenseBridge Extended Preview (2026-11-08, full UI)
          target_commitish: main
          body_path: release-output/RELEASE_NOTES.md
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: |
            release-output/ApexSenseBridge-Extended-Preview-20261108.zip
            release-output/SHA256SUMS.txt
